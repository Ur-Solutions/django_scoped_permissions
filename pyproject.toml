[tool.poetry]
name = "django_scoped_permissions"
version = "0.1.8"
description = "Test scoped permissions"
authors = ["Magnus Buvarp <magnus.buvarp@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.0.6"
graphene-django = "^3.2.2"
graphene-django-cud = "^0.12.0"
pyjwt = "^1.7.1"
factory_boy = "^3.3.0"
pydash = "^8.0.1"

[tool.poetry.dev-dependencies]
addict = "^2.4.0"
pytest = "^8.2.2"
pytest-django = "^4.8.0"
pytest-watch = "^4.2.0"
setuptools = "^45.3.0"
twine = "^3.8.0"
pytest-cov = "^5.0.0"
watchdog = "^4.0.1"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
