[tool.poetry]
name = "django_scoped_permissions"
version = "0.1.8"
description = "Test scoped permissions"
authors = ["Magnus Buvarp <magnus.buvarp@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
django = ">=5.2,<6.2"
graphene-django = ">=3.2.3,<4"
graphene-django-cud = ">=0.13,<0.14"
pyjwt = "^1.7.1"
pydash = ">=8.0.1,<9"
lark = "^1.1.9"

[tool.poetry.group.dev.dependencies]
factory_boy = "^3.3.3"
addict = "^2.4.0"
pytest = ">=9,<10"
pytest-django = ">=4.11.1,<5"
pytest-watch = "^4.2.0"
setuptools = ">=80,<85"
twine = ">=6,<7"
pytest-cov = ">=7,<8"
pytest-testmon = ">=2.1,<3"
watchdog = ">=6,<7"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
