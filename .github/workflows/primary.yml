name: Test and push

on:
  push:
    branches: [develop, master]
    tags: [v*]
  pull_request:
    branches: [develop, master, mist]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0", "6.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install test Python
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: mise install "python@$PYTHON_VERSION"
      - name: Select test interpreter
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python }}
        run: mise exec -- poetry env use "$(mise which python)"
      - name: Install locked dependencies
        run: mise exec -- poetry install --no-interaction
      - name: Select Django and verify compatibility environment
        env:
          DJANGO: ${{ matrix.django }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          mise exec -- poetry run python -m pip install "Django==$DJANGO.*"
          mise exec -- poetry run python -m pip check
          mise exec -- poetry run python - <<'PY'
          import os
          import sys
          import django

          python_version = ".".join(map(str, sys.version_info[:2]))
          django_version = ".".join(map(str, django.VERSION[:2]))
          assert python_version == os.environ["PYTHON_VERSION"]
          assert django_version == os.environ["DJANGO"]
          print(f"Python {sys.version.split()[0]} / Django {django.get_version()}")
          PY
      - name: Test permissions and GraphQL integration
        run: mise exec -- make test-cov
      - name: Check model migrations
        if: success() || failure()
        run: mise exec -- poetry run python manage.py makemigrations --check --dry-run --noinput
      - name: Build distributions
        if: success() || failure()
        run: |
          mise exec -- poetry check --lock
          mise exec -- make build
          mise exec -- poetry run twine check dist/*
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build and publish package
        run: |
          mise exec -- poetry install --no-interaction
          mise exec -- make build
          mise exec -- make release
