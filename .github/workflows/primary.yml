name: Test and push

on:
  push:
    branches: [develop, master]
    tags: [v*]
  pull_request:
    branches: [develop, master, mist]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        django: ["Django>=5.2,<5.3", "Django>=6.0,<6.1", "Django>=6.1,<6.2"]
        factory: ["factory-boy==2.12.0", "factory-boy>=3,<4"]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Install locked dependencies
        run: mise exec -- poetry install --no-interaction
      - name: Select compatibility versions
        env:
          DJANGO: ${{ matrix.django }}
          FACTORY: ${{ matrix.factory }}
        run: mise exec -- poetry run python -m pip install "$DJANGO" "$FACTORY"
      - name: Test permissions and GraphQL integration
        run: mise exec -- make test-cov
      - name: Check model migrations
        if: success() || failure()
        run: mise exec -- poetry run python manage.py makemigrations --check --dry-run --noinput
      - name: Build distributions
        if: success() || failure()
        run: |
          mise exec -- poetry check --lock
          mise exec -- make build
          mise exec -- poetry run twine check dist/*
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build and publish package
        run: |
          mise exec -- poetry install --no-interaction
          mise exec -- make build
          mise exec -- make release
